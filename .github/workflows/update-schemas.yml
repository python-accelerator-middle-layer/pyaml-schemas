
name: Update JSON schemas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write

jobs:
  update-schemas:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: [release, main]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-${{ matrix.version }}.txt

      - name: Generate schemas
        run: python scripts/generate_schemas.py --output schemas/${{ matrix.version }}

      - name: Upload schemas
        uses: actions/upload-artifact@v4
        with:
          name: schemas-${{ matrix.version }}
          path: schemas/${{ matrix.version }}/
          if-no-files-found: error

  commit-schemas:
    needs: update-schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download main schemas
        uses: actions/download-artifact@v4
        with:
          name: schemas-main
          path: schemas/main

      - name: Download release schemas
        uses: actions/download-artifact@v4
        with:
          name: schemas-release
          path: schemas/release

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schemas/
          git diff --cached --quiet && exit 0

          git commit -m "Update JSON schemas"
          git push